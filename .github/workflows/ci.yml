name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The OpenCode 2 tests run against; npm's opencode-ai pins the OpenCode 1 one.
  OPENCODE2_VERSION: v2.2.5

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install OpenCode 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/opencode2"
          gh release download "$OPENCODE2_VERSION" --repo anomalyco/opencode --pattern 'opencode-linux-x64.tar.gz' --dir "$RUNNER_TEMP/opencode2"
          cd "$RUNNER_TEMP/opencode2"
          case 'opencode-linux-x64.tar.gz' in *.zip) unzip -q 'opencode-linux-x64.tar.gz' ;; *) tar xzf 'opencode-linux-x64.tar.gz' ;; esac
          echo "OPENCODE2_BIN=$RUNNER_TEMP/opencode2/opencode" >> "$GITHUB_ENV"
      - name: End-to-end tests on real OpenCode 1 and 2
        run: npm run test:e2e
